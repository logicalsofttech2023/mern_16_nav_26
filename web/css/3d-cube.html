<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: #121212;
  }

  /* 1. Outer wrapper establishes the 3D viewing depth */
  .scene {
    width: 150px;
    height: 150px;
    perspective: 600px;
  }

  /* 2. Parent container holds children in 3D space and animates */
  .cube {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: spin 6s infinite linear;
  }

  /* 3. Shared styling for all six faces */
  .face {
    position: absolute;
    width: 150px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 20px;
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.8);
  }

  /* 4. Position each face in 3D space (half the cube's width = 75px) */
  .front  { background: rgba(255, 87, 34, 0.8);  transform: rotateY(0deg)   translateZ(75px); }
  .back   { background: rgba(76, 175, 80, 0.8);  transform: rotateY(180deg) translateZ(75px); }
  .right  { background: rgba(33, 150, 243, 0.8); transform: rotateY(90deg)  translateZ(75px); }
  .left   { background: rgba(255, 193, 7, 0.8);  transform: rotateY(-90deg) translateZ(75px); }
  .top    { background: rgba(156, 39, 176, 0.8); transform: rotateX(90deg)  translateZ(75px); }
  .bottom { background: rgba(0, 188, 212, 0.8);  transform: rotateX(-90deg) translateZ(75px); }

  /* 5. Continuous 3D rotation animation */
  @keyframes spin {
    0%   { transform: rotateX(0deg) rotateY(0deg); }
    100% { transform: rotateX(360deg) rotateY(360deg); }
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="cube">
      <div class="face front">Front</div>
      <div class="face back">Back</div>
      <div class="face right">Right</div>
      <div class="face left">Left</div>
      <div class="face top">Top</div>
      <div class="face bottom">Bottom</div>
    </div>
  </div>

</body>
</html>
