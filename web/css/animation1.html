<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #efe8dd;
        overflow-x: hidden;
      }
      body {
        min-height: 100vh;
      }

      /* margin (padding nahi) taaki camera angle same rahe */
      article.container {
        perspective: 2600px;
        perspective-origin: 50% -1150px;
        margin-top: 120px;
        height: 700px;
      }

      .stage {
        margin: 0 auto;
        transform-style: preserve-3d;
        transform: rotateY(-45deg);
        width: 460px;
      }
      .stage div {
        position: absolute;
        transform-style: preserve-3d;
      }

      .stage .back-left {
        background: #6b522b;
        border-left: 6px solid #574625;
        border-top: 6px solid #8a683d;
        height: 120px;
        transform: rotateY(90deg) translateX(-256px);
        width: 500px;
      }
      .stage .back-right {
        background: #9c7442;
        border-right: 6px solid #78552c;
        border-top: 6px solid #b5854a;
        height: 120px;
        transform: translateX(253px) translateZ(3px);
        width: 446px;
      }

      .stage .platform-left {
        background: #bcb3a8;
        border-bottom: 6px solid #857964;
        height: 220px;
        transform: rotateX(90deg) translateY(396px) translateX(253px)
          translateZ(-13px);
        width: 446px;
      }
      .stage .platform-right {
        background: #bcb3a8;
        border-bottom: 6px solid #847660;
        border-right: 6px solid #554c3d;
        height: 164px;
        transform: rotateX(90deg) translateY(88px) translateX(253px)
          translateZ(-41px);
        width: 446px;
      }

      .stage .pit-left {
        background: #4d4233;
        height: 800px;
        transform: translate3D(254px, 125px, 285px);
        width: 447px;
      }
      .stage .pit-right {
        background: #847660;
        height: 800px;
        transform: translate3D(254px, 125px, 173px);
        width: 451px;
      }
      .stage .pit-back {
        background: #6b522b;
        height: 220px;
        transform: rotateY(90deg) translate3D(-200px, 87px, 168px);
        width: 170px;
      }

      .stage .shadow {
        background: transparent;
        box-shadow: -600px 0 50px #afa79f;
        height: 550px;
        transform: rotateX(90deg) translateZ(-166px) translateX(550px);
        width: 550px;
      }

      /* glow (fix: modern gradient syntax) */
      .stage .platform-left span {
        background: radial-gradient(
          circle at left,
          #f3cac8,
          #c8b8ad 70px,
          #bcb3a8 90px
        );
        display: block;
        height: 200px;
        left: 0;
        position: absolute;
        width: 120px;
      }
      .stage .platform-right span {
        background: radial-gradient(
          circle at top,
          #cdebe8,
          #c2cbc1 40px,
          #bcb3a8 60px
        );
        display: block;
        height: 60px;
        left: 280px;
        position: absolute;
        width: 150px;
      }

      /* portals */
      .stage .portal {
        background: #000;
        border-radius: 44px/62px;
        box-shadow: 0 0 15px 4px #fff;
        height: 72px;
        width: 48px;
      }
      .stage .portal:before {
        border-radius: 44px/62px;
        border: 4px solid #fff;
        content: "";
        position: absolute;
        left: -11px;
        top: -11px;
        right: -11px;
        bottom: -11px;
      }
      .stage .portal.red {
        background: radial-gradient(#000, #000 50%, #ff4640 70%);
        border: 7px solid #ff4640;
        transform: translate3D(236px, 25px, 385px) rotateY(90deg) skewX(5deg);
      }
      .stage .portal.blue {
        background: radial-gradient(#000, #000 50%, #258aff 70%);
        border: 7px solid #258aff;
        transform: translate3D(586px, 25px, 4px) skewX(-5deg);
      }

      .stage .door {
        background: #efe8dd;
        border-bottom: 6px solid #bcb3a8;
        border-left: 7px solid #78552e;
        height: 85px;
        transform: translate3D(450px, 34px, 4px);
        width: 65px;
      }

      /* dude */
      .dude,
      .dude-shadow {
        height: 100px;
        width: 30px;
      }
      .dude figure,
      .dude-shadow figure {
        background: #000;
        display: block;
        position: absolute;
      }
      .dude figure.head,
      .dude-shadow figure.head {
        border-radius: 22px;
        height: 20px;
        left: 3px;
        top: 0;
        width: 20px;
      }
      .dude figure.body,
      .dude-shadow figure.body {
        border-radius: 30px 30px 0 0;
        height: 30px;
        top: 21px;
        width: 26px;
      }
      .dude figure.body:before,
      .dude figure.body:after,
      .dude-shadow figure.body:before,
      .dude-shadow figure.body:after {
        background: #000;
        content: "";
        height: 15px;
        position: absolute;
        top: 30px;
        width: 9px;
      }
      .dude figure.body:before,
      .dude-shadow figure.body:before {
        left: 3px;
      }
      .dude figure.body:after,
      .dude-shadow figure.body:after {
        left: 14px;
      }

      .stage .dude.one {
        transform: translate3D(514px, 50px, 375px) rotateY(78deg);
      }
      .stage .dude-shadow.one {
        opacity: 0.1;
        transform: translateX(-12px) rotateX(90deg) translateY(8px);
      }

      .stage .dude.two {
        transform: translate3D(610px, 40px, 10px) rotateY(15deg);
      }
      .stage .dude.two figure.arm {
        background: #000;
        height: 8px;
        position: absolute;
        top: 20px;
        width: 20px;
      }
      .stage .dude.two figure.arm.left {
        left: -13px;
        transform: rotateZ(40deg);
      }
      .stage .dude.two figure.arm.right {
        right: -10px;
        transform: rotateZ(-40deg);
      }
      .stage .dude-shadow.two {
        opacity: 0.1;
        transform: translateY(12px) translateX(-16px) translateZ(-6px)
          rotateZ(-90deg) rotateY(90deg) rotateZ(50deg) skewX(30deg) scaleX(0.8);
      }

      @keyframes move-dude-one {
        0% {
          transform: translate3D(514px, -10px, 375px) rotateY(78deg) scaleY(2);
        }
        1%,
        18% {
          opacity: 1;
          transform: translate3D(514px, 50px, 375px) rotateY(78deg) scaleY(1);
        }
        34%,
        39% {
          opacity: 1;
          transform: translate3D(284px, 40px, 375px) rotateY(78deg);
        }
        41%,
        42% {
          opacity: 1;
          transform: translate3D(234px, 40px, 375px) rotateY(78deg);
        }
        43%,
        100% {
          opacity: 0;
          transform: translate3D(234px, 40px, 375px) rotateY(78deg);
        }
      }
      .dude.one {
        animation: move-dude-one 10s linear infinite;
        opacity: 0;
      }

      @keyframes move-dude-two {
        0%,
        42% {
          opacity: 0;
          transform: translate3D(610px, 40px, 10px) rotateY(15deg);
        }
        42.5% {
          opacity: 1;
          transform: translate3D(610px, 40px, 10px) rotateY(15deg);
        }
        46%,
        75% {
          opacity: 1;
          transform: translate3D(610px, 40px, 120px) rotateY(15deg);
        }
        76%,
        97% {
          opacity: 0;
          transform: translate3D(610px, -10px, 120px) rotateY(15deg) scaleY(2);
        }
        98%,
        100% {
          opacity: 0;
          transform: translate3D(610px, -10px, 120px) rotateY(15deg) scaleY(2);
        }
      }
      @keyframes arms {
        0%,
        53% {
          opacity: 0;
        }
        54%,
        100% {
          opacity: 1;
        }
      }
      .dude.two {
        animation: move-dude-two 10s linear infinite;
        opacity: 0;
      }
      .dude.two figure.arm {
        animation: arms 10s linear infinite;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <article class="container">
      <section class="stage">
        <div class="shadow"></div>
        <div class="back-left"></div>
        <div class="back-right"></div>
        <div class="platform-left"><span></span></div>
        <div class="platform-right"><span></span></div>
        <div class="pit-left"></div>
        <div class="pit-right"></div>
        <div class="pit-back"></div>

        <div class="portal red"></div>
        <div class="portal blue"></div>
        <div class="door"></div>

        <div class="dude one">
          <figure class="head"></figure>
          <figure class="body"></figure>
          <div class="dude-shadow one">
            <figure class="head"></figure>
            <figure class="body"></figure>
          </div>
        </div>

        <div class="dude two">
          <figure class="head"></figure>
          <figure class="body"></figure>
          <figure class="arm left"></figure>
          <figure class="arm right"></figure>
          <div class="dude-shadow two">
            <figure class="head"></figure>
            <figure class="body"></figure>
            <figure class="arm left"></figure>
            <figure class="arm right"></figure>
          </div>
        </div>
      </section>
    </article>
  </body>
</html>
